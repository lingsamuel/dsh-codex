name: Build

on: push

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:plugin
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-chatgpt
          path: artifacts/*.tgz
          if-no-files-found: error
